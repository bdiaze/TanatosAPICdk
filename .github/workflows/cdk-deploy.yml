name: CDK Deploy on AWS

on:
    push:
        branches:
            - main
      
jobs:
    build:
        runs-on: ubuntu-latest
        environment: Production
        permissions:
            contents: read
            id-token: write
        env:
            APP_NAME: ${{ vars.APP_NAME }}
            ACCOUNT_AWS: ${{ vars.ACCOUNT_AWS }}
            REGION_AWS: ${{ vars.REGION_AWS }}
            
            COGNITO_DOMAIN_NAME: ${{ vars.COGNITO_DOMAIN_NAME }}
            COGNITO_CUSTOM_DOMAIN: ${{ vars.COGNITO_CUSTOM_DOMAIN }}
            ARN_COGNITO_CERTIFICATE: ${{ vars.ARN_COGNITO_CERTIFICATE }}
            
            CALLBACK_URLS: ${{ vars.CALLBACK_URLS }}
            LOGOUT_URLS: ${{ vars.LOGOUT_URLS }}
            ACCESS_TOKEN_VALIDITY_MINUTES: ${{ vars.ACCESS_TOKEN_VALIDITY_MINUTES }}
            ID_TOKEN_VALIDITY_MINUTES: ${{ vars.ID_TOKEN_VALIDITY_MINUTES }}
            REFRESH_TOKEN_VALIDITY_MINUTES: ${{ vars.REFRESH_TOKEN_VALIDITY_MINUTES }}
            
            COGNITO_TRIGGER_TOKEN_VALIDITY_MINUTES: ${{ vars.COGNITO_TRIGGER_TOKEN_VALIDITY_MINUTES }}
            ARN_PARAMETER_COGNITO_TRIGGER_LAMBDA_ARN: ${{ vars.ARN_PARAMETER_COGNITO_TRIGGER_LAMBDA_ARN }}
            
            NOTIFICACIONES_TOKEN_VALIDITY_MINUTES: ${{ vars.NOTIFICACIONES_TOKEN_VALIDITY_MINUTES }}
                        
            PUBLISH_ZIP: ${{ vars.PUBLISH_ZIP }}
            HANDLER: ${{ vars.HANDLER }}
            TIMEOUT: ${{ vars.TIMEOUT }}
            MEMORY_SIZE: ${{ vars.MEMORY_SIZE }}
            DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
            API_MAPPING_KEY: ${{ vars.API_MAPPING_KEY }}
            VPC_ID: ${{ vars.VPC_ID }}
            PRIVATE_WITH_INTERNET_ID_1: ${{ vars.PRIVATE_WITH_INTERNET_ID_1 }}
            PRIVATE_WITH_INTERNET_ID_2: ${{ vars.PRIVATE_WITH_INTERNET_ID_2 }}
            RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
            
            ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
            SECRET_ARN_CONNECTION_STRING: ${{ vars.SECRET_ARN_CONNECTION_STRING }}
            ARN_PARAMETER_HERMES_API_KEY_ID: ${{ vars.ARN_PARAMETER_HERMES_API_KEY_ID }}
            ARN_PARAMETER_HERMES_API_URL: ${{ vars.ARN_PARAMETER_HERMES_API_URL }}
            HERMES_DE_NOMBRE: ${{ vars.HERMES_DE_NOMBRE }}
            HERMES_DE_CORREO: ${{ vars.HERMES_DE_CORREO }}
            HERMES_DE_WHATSAPP: ${{ vars.HERMES_DE_WHATSAPP }}
            ARN_PARAMETER_KAIROS_API_URL: ${{ vars.ARN_PARAMETER_KAIROS_API_URL }}
            ARN_PARAMETER_KAIROS_API_KEY_ID: ${{ vars.ARN_PARAMETER_KAIROS_API_KEY_ID }}
            ARN_PARAMETER_NOTIFICACIONES_LAMBDA_ARN: ${{ vars.ARN_PARAMETER_NOTIFICACIONES_LAMBDA_ARN }}
            ARN_PARAMETER_NOTIFICACIONES_EJECUCION_ROLE_ARN: ${{ vars.ARN_PARAMETER_NOTIFICACIONES_EJECUCION_ROLE_ARN }}
            GOOGLE_RECAPTCHA_CREDENTIAL: ${{ secrets.GOOGLE_RECAPTCHA_CREDENTIAL }}
            GOOGLE_RECAPTCHA_PROJECT_ID: ${{ vars.GOOGLE_RECAPTCHA_PROJECT_ID }}
            GOOGLE_RECAPTCHA_SITE_KEY: ${{ vars.GOOGLE_RECAPTCHA_SITE_KEY }}
            DESTINATARIOS_NUEVO_MENSAJE: ${{ vars.DESTINATARIOS_NUEVO_MENSAJE }}
            FLOW_API_KEY: ${{ secrets.FLOW_API_KEY }}
            FLOW_SECRET_KEY: ${{ secrets.FLOW_SECRET_KEY }}
            FLOW_API_URL: ${{ vars.FLOW_API_URL }}
            FLOW_URL_CALLBACK: ${{ vars.FLOW_URL_CALLBACK }}
            FLOW_URL_RETORNO: ${{ vars.FLOW_URL_RETORNO }}
            URL_CODIGO_VERIFICACION: ${{ vars.URL_CODIGO_VERIFICACION }}
            
            APP_SCHEMA_NAME: ${{ vars.APP_SCHEMA_NAME }}
            INITIAL_CREATION_HANDLER: ${{ vars.INITIAL_CREATION_HANDLER }}
            INITIAL_CREATION_PUBLISH_ZIP: ${{ vars.INITIAL_CREATION_PUBLISH_ZIP }}
            MIGRATION_SCRIPT: ${{ vars.MIGRATION_SCRIPT }}
                        
        steps:
            - name: Checkout Repositorio
              uses: actions/checkout@v4
      
            - name: Instalar .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ vars.VERSION_DOTNET }}
      
            - name: Instalar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ vars.VERSION_NODEJS }}
                                                      
            - name: Instalar AWS CDK
              run: npm install --ignore-scripts -g aws-cdk@2.1125.0
              
            - name: Instalar .NET EF
              run: dotnet tool install --global dotnet-ef --version ${{ vars.VERSION_DOTNET_EF }}
              
            - name: .NET Restore
              run: dotnet restore
              
            - name: Test con coverage
              working-directory: ${{ vars.TEST_DIRECTORY }}
              run: |
                dotnet test --configuration Release \
                  --collect:"XPlat Code Coverage" \
                  --results-directory ./coverage \
                  -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Program.cs,**/*.g.cs" \
                  -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]Microsoft.AspNetCore.OpenApi.Generated.*,[*]System.Runtime.CompilerServices.*"
                xml=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
                echo "--- Coverage por Clase ---"
                tr '\n' ' ' < "$xml" | grep -oP '<class [^>]*>' | while read -r line; do
                    name=$(echo "$line" | grep -oP ' name="\K[^"]*' | sed 's/&lt;/</g; s/&gt;/>/g; s/&amp;/\&/g')
                    line_rate=$(echo "$line" | grep -oP ' line-rate="\K[^"]*')
                    branch_rate=$(echo "$line" | grep -oP ' branch-rate="\K[^"]*')
                    line_pct=$(echo "scale=2; $line_rate * 100" | bc)
                    branch_pct=$(echo "scale=2; $branch_rate * 100" | bc)
                    echo "Line: ${line_pct}% - Branch: ${branch_pct}% - ${name}"
                done                
                line_rate=$(grep -oP ' line-rate="\K[^"]+' "$xml" | head -1)
                branch_rate=$(grep -oP ' branch-rate="\K[^"]+' "$xml" | head -1)
                line_pct=$(echo "scale=2; $line_rate * 100" | bc)
                branch_pct=$(echo "scale=2; $branch_rate * 100" | bc)
                echo "--- Resumen Final ---"
                echo "Line Coverage:   $line_pct%"
                echo "Branch Coverage: $branch_pct%"
                # if [ "$line_pct" -lt 70 ]; then
                #   echo "Coverage insuficiente: $line_pct% (mínimo 70%)"
                #   exit 1
                # fi
                echo "¡Coverage aceptado!"
              
            - name: Publish .NET Initial Creation Lambda
              working-directory: ${{ vars.INITIAL_CREATION_DIRECTORY }}
              run: dotnet publish /p:PublishDir=../publish /p:PublishReadyToRun=true -r linux-arm64 --no-self-contained
              
            - name: Creación de bundle EF Migrations
              run: dotnet ef migrations script --idempotent -o ${{ vars.INITIAL_CREATION_DIRECTORY }}/publish/${{ vars.MIGRATION_SCRIPT }} --project ${{ vars.PROJECT_NAME_DESIGN }}
              
            - name: Compress Publish Directory .NET Initial Creation Lambda
              working-directory: ${{ vars.INITIAL_CREATION_DIRECTORY }}/publish
              run: zip -r -q -T ./publish.zip ./*
            
            - name: Publish .NET AoT Minimal API
              run: |
                  docker run --rm -v ${{ github.workspace }}:/src -w /src public.ecr.aws/amazonlinux/amazonlinux:2023 \bash -c "
                    yum install -y dotnet-sdk-10.0 gcc zlib-devel && 
                    dotnet publish ${{ vars.PROJECT_NAME }} /p:PublishDir=../publish /p:PublishAot=true -r linux-x64 --self-contained &&
                    cd ./publish &&
                    zip -r -T ./publish.zip ./*"
      
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
              with:
                  aws-region: ${{ vars.REGION_AWS }}
                  role-to-assume: ${{ vars.ARN_GITHUB_ROLE }}
                  
            - name: CDK Synth
              working-directory: ${{ vars.DIRECTORIO_CDK }}
              run: cdk synth
              
            - name: CDK Diff
              working-directory: ${{ vars.DIRECTORIO_CDK }}
              run: cdk --app cdk.out diff
              
            - name: CDK Deploy
              working-directory: ${{ vars.DIRECTORIO_CDK }}
              run: cdk --app cdk.out deploy --require-approval never --no-previous-parameters
          