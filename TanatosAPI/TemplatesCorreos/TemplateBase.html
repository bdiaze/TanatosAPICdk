<!doctype html>
<html lang="es-cl">
  <head>
    <meta charset="utf-8" />
    <style>
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #292929 !important;
        }
        body, td, span {
          color: #f5f5f5 !important; 
        }
        .border-cell { 
          border-color: #c6c6ca !important; 
        }
      }
    </style>
  </head>
  <body style="font-family: Roboto, 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; color: #484b51; margin: 0; padding: 0;">
    <table cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
      <tr>
        <td style="border: 1px solid #f5f5f5; padding: 0 16px;" class="border-cell">
          <table cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;" >
            <tr>
              <td style="vertical-align: middle;">
                <a href="https://todoenorden.ankatu.cl/" target="_blank" style="text-decoration: none; display: inline-block;">
                  <img src="https://todoenorden.ankatu.cl/images/logo.svg" alt="Logo Todo en Orden" width="110" height="auto" style="display: block; margin-top: 4px;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="border-left: 1px solid #f5f5f5; border-right: 1px solid #f5f5f5; padding: 16px;" class="border-cell">
          {{ CONTENIDO }}
        </td>
      </tr>
      <tr>
        <td style="border: 1px solid #f5f5f5; background-color: #292929 !important; padding: 0 16px; margin-top: 8px;" class="border-cell">
          <table cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;" >
            <tr>
              <td style="vertical-align: middle;">
                <a href="https://todoenorden.ankatu.cl/" target="_blank" style="text-decoration: none; display: inline-block;">
                  <img src="https://todoenorden.ankatu.cl/images/logo-blanco.svg" alt="Logo Todo en Orden" width="110" height="auto" style="display: block; margin-top: 4px;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
