<table cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <th align="center" style="padding-bottom: 16px;">
        <span style="mso-color-alt: #f5f5f5; font-weight: 600; font-size: 24px; line-height: 34px; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;">
            {{ TITULO }}
        </span>
    </th>
  </tr>
  <tr>
    <td>
        <table align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
            <tr>
                <th align="center" class="border-cell" style="mso-color-alt: #f5f5f5; padding: 12px; padding-top: 0; font-size: 14px; line-height: 20px; font-weight: 400; vertical-align: top; text-align: center; text-wrap: balance;">
                    {{ SUBTITULO }}
                </th>
            </tr>
            {{ if CODIGO != null}}
            <tr>
                <td align="center" class="border-cell" style="mso-color-alt: #f5f5f5; padding: 12px; font-size: 34px; line-height: 40px; font-weight: 600; vertical-align: top; text-align: center; text-wrap: balance;">
                    {{ CODIGO }}
                </td>
            </tr>
            {{ end }}
            {{ if TEXTO_LINK != null && URL_LINK != null }}
            <tr>
                <td align="center" class="border-cell" style="padding-bottom: 4px; vertical-align: top; text-align: center;">
                    <a href="{{ URL_LINK }}" style="font-weight: 400; font-size: 14px; line-height: 20px; mso-color-alt: #f5f5f5;">
                        {{ TEXTO_LINK }}
                    </a>
                </td>
            </tr>
            {{ end }}
        </table>
    </td>
  </tr>
</table>
