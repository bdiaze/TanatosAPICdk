<table cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <th align="center" style="padding-bottom: 16px;">
            <span style="mso-color-alt: #f5f5f5; font-weight: 600; font-size: 24px; line-height: 34px; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;">
                ¡Tienes una obligación menos!
            </span>
        </th>
    </tr>
    <tr>
        <td>
            <table align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                <tr>
                    <td align="center" class="border-cell" style="mso-color-alt: #f5f5f5; padding: 12px; padding-top: 0; font-size: 14px; line-height: 20px; vertical-align: top; text-align: center; text-wrap: balance; font-weight: 400;">
                        {{ if NOMBRE_EMPLEADO }}
                        {{ NOMBRE_EMPLEADO }}, ya
                        {{ else }}
                        Ya
                        {{ end }} no tienes asignada la obligación {{ NOMBRE_OBLIGACION }}
                    </td>
                </tr>
                <tr>
                    <td align="center" class="border-cell" style="vertical-align: top; text-align: center;">
                        <table align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                            <tr>
                                <td align="center" class="border-cell" style="mso-color-alt: #f5f5f5; padding: 12px; padding-top: 0; font-size: 14px; line-height: 20px; vertical-align: top; text-align: center; text-wrap: balance; font-weight: 400; ">
                                    <i>Pero no te olvides de tus otras obligaciones 🙌</i>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
